# NOTE: This file contains PLACEHOLDER values for local/demo use only.
# In production, create secrets via `kubectl create secret` / a secret manager
# (Azure Key Vault + CSI driver, Sealed Secrets, etc.) — never commit real secrets to git.
apiVersion: v1
kind: Secret
metadata:
  name: interview-backend-secrets
  namespace: interview-platform
type: Opaque
stringData:
  JWT_SECRET_KEY: "replace-with-a-strong-random-secret"
  DATABASE_USER: "sa"
  DATABASE_PASSWORD: "replace-with-a-strong-password"
  AZURE_OPENAI_ENDPOINT: "https://YOUR-RESOURCE.openai.azure.com/"
  AZURE_OPENAI_API_KEY: "replace-with-azure-openai-key"
  AZURE_SPEECH_KEY: "replace-with-azure-speech-key"
